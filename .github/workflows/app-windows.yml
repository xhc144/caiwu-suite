name: app-windows

on:
  pull_request:
    paths:
      - "app/apps/desktop/**"
      - ".github/workflows/app-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 全仓失败保持为失败；打包和桌面 QA 独立收集证据，不因网页检查延误而跳过。
  nsis:
    if: github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: pwsh
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 仅影响本 job 的 Git 检出；保留仓库 LF，避免 Windows autocrlf 使全仓格式检查误报。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: 安装冻结依赖和浏览器
        id: install
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install chromium
      - name: 桌面真实 Node 子进程退出回归
        id: shutdown-node
        run: |
          pnpm exec vitest run apps/desktop/src/test/shutdown.test.ts 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-shutdown-node.log"
          exit $LASTEXITCODE
      - name: 构建网页和桌面
        id: build
        run: pnpm desktop:build
      - name: 准备独立合成账套（Node ABI）
        run: pnpm exec tsx apps/desktop/qa/prepare-fixture.ts "$env:RUNNER_TEMP/m21-qa"
      - name: 为 Electron 重编译 SQLite
        id: native
        run: |
          node apps/desktop/build/prepare-native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C apps/desktop exec electron-builder install-app-deps --platform win32 --arch x64
      - name: 生成用于覆盖回归的旧版本 NSIS（相同代码，不冒充历史发行版）
        run: |
          pnpm -C apps/desktop exec electron-builder --win nsis --x64 --publish never --config.extraMetadata.version=0.0.9 --config.directories.output=release-old 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-package-old.log"
          exit $LASTEXITCODE
      - name: 生成私有新版 NSIS
        id: package
        run: |
          pnpm -C apps/desktop exec electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-package.log"
          exit $LASTEXITCODE
      - name: Windows 安装启动、覆盖升级、卸载保留数据回归
        id: desktop-qa
        env:
          CAIWU_DESKTOP_QA_FIXTURE: ${{ runner.temp }}/m21-qa
          CAIWU_DESKTOP_EXECUTABLE: ${{ runner.temp }}/m21-installed/caiwu-desktop/caiwu-desktop.exe
          CAIWU_DESKTOP_OLD_INSTALLER: ${{ github.workspace }}/app/apps/desktop/release-old/caiwu-desktop-0.0.9-x64-setup.exe
          CAIWU_DESKTOP_NEW_INSTALLER: ${{ github.workspace }}/app/apps/desktop/release/caiwu-desktop-0.1.0-x64-setup.exe
        run: |
          pnpm exec playwright test --config apps/desktop/playwright.config.ts 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-desktop-qa.log"
          exit $LASTEXITCODE
      - name: 保存私有安装包
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: caiwu-desktop-windows-nsis
          path: app/apps/desktop/release/*-setup.exe
          if-no-files-found: error
          retention-days: 3
      - name: 保存去敏步骤状态
        if: always()
        run: |
          @(
            'install=${{ steps.install.outcome }}',
            'shutdown-node=${{ steps.shutdown-node.outcome }}',
            'build=${{ steps.build.outcome }}',
            'native=${{ steps.native.outcome }}',
            'nsis=${{ steps.package.outcome }}',
            'windows-installed-qa=${{ steps.desktop-qa.outcome }}'
          ) | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/m21-steps.log"
      - name: 保存必要构建日志（不包含账套、配置或截图）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caiwu-desktop-build-logs
          path: |
            ${{ runner.temp }}/m21-steps.log
            ${{ runner.temp }}/m21-shutdown-node.log
            ${{ runner.temp }}/m21-package-old.log
            ${{ runner.temp }}/m21-package.log
            ${{ runner.temp }}/m21-desktop-qa.log
            ${{ runner.temp }}/m21-qa/config/logs/desktop.log*
          if-no-files-found: ignore
          retention-days: 3

  checks:
    if: github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: pwsh
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 仅影响本 job 的 Git 检出；保留仓库 LF，避免 Windows autocrlf 使全仓格式检查误报。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: 安装冻结依赖和浏览器
        id: install
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install chromium
      - name: 全仓检查
        id: check
        # 保留失败，独立构建/安装回归继续收集结果；末尾显式使 job 失败，不能掩盖 check。
        continue-on-error: true
        run: pnpm check
      - name: 全仓检查失败时仍执行独立网页 E2E
        id: web-e2e
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        run: pnpm e2e
      - name: 保存去敏检查步骤状态
        if: always()
        run: |
          @(
            'install=${{ steps.install.outcome }}',
            'check=${{ steps.check.outcome }}',
            'independent-web-e2e=${{ steps.web-e2e.outcome }}'
          ) | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/m21-check-steps.log"
      - name: 保存私有检查状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caiwu-desktop-check-status
          path: ${{ runner.temp }}/m21-check-steps.log
          if-no-files-found: ignore
          retention-days: 3
      - name: 保留全仓检查的失败结论
        if: always() && (steps.check.outcome == 'failure' || steps.web-e2e.outcome == 'failure')
        run: |
          Write-Error 'pnpm check 或独立网页 E2E 失败；即使已生成安装包，本 workflow 仍为失败。请查看原始检查错误。'
          exit 1
