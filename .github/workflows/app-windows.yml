name: app-windows

on:
  pull_request:
    paths:
      - "app/apps/desktop/**"
      - ".github/workflows/app-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 全仓失败保持为失败；打包和桌面 QA 独立收集证据，不因网页检查延误而跳过。
  nsis:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: pwsh
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 仅影响本 job 的 Git 检出；保留仓库 LF，避免 Windows autocrlf 使全仓格式检查误报。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: 安装冻结依赖和浏览器
        id: install
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install chromium
      - name: 桌面真实 Node 子进程退出回归
        id: shutdown-node
        run: |
          pnpm gen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsc -p apps/desktop/tsconfig.qa.json --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run apps/desktop/src/test/shutdown.test.ts 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-shutdown-node.log"
          exit $LASTEXITCODE
      - name: 构建网页和桌面
        id: build
        run: pnpm desktop:build
      - name: 准备独立合成账套（Node ABI）
        run: |
          pnpm exec tsx apps/desktop/qa/prepare-fixture.ts "$env:RUNNER_TEMP/m21-qa"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsx apps/desktop/qa/prepare-fixture.ts "$env:RUNNER_TEMP/m21-update-qa"
      - name: 为 Electron 重编译 SQLite
        id: native
        run: |
          node apps/desktop/build/prepare-native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C apps/desktop exec electron-builder install-app-deps --platform win32 --arch x64
      - name: 生成用于覆盖回归的旧版本 NSIS（相同代码，不冒充历史发行版）
        run: |
          pnpm -C apps/desktop exec electron-builder --win nsis --x64 --publish never --config.extraMetadata.version=0.0.9 --config.directories.output=release-old 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-package-old.log"
          exit $LASTEXITCODE
      - name: 生成本分支新版 NSIS（不发布 Release）
        id: package
        run: |
          pnpm -C apps/desktop exec electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-package.log"
          exit $LASTEXITCODE
      - name: 生成同版本 SHA-256 更新清单
        run: |
          node apps/desktop/build/update-manifest.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          "CAIWU_DESKTOP_EXPECTED_VERSION=$version" >> $env:GITHUB_ENV
          "CAIWU_DESKTOP_NEW_INSTALLER=${{ github.workspace }}/app/apps/desktop/release/caiwu-desktop-$version-x64-setup.exe" >> $env:GITHUB_ENV
      - name: 核对安装包 SHA-256 和 Windows 内嵌版本
        run: pnpm exec tsx apps/desktop/qa/verify-update.ts
      - name: Windows 安装启动、覆盖升级、卸载保留数据回归
        id: desktop-qa
        env:
          CAIWU_DESKTOP_QA_FIXTURE: ${{ runner.temp }}/m21-qa
          CAIWU_DESKTOP_EXECUTABLE: ${{ runner.temp }}/m21-installed/caiwu-desktop/caiwu-desktop.exe
          CAIWU_DESKTOP_OLD_INSTALLER: ${{ github.workspace }}/app/apps/desktop/release-old/caiwu-desktop-0.0.9-x64-setup.exe
        run: |
          pnpm exec playwright test --config apps/desktop/playwright.config.ts 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-desktop-qa.log"
          exit $LASTEXITCODE
      - name: 健康账套真实备份退出后经 Windows Shell 启动安装器（遇安全提示暂停）
        id: update-handoff
        if: steps.desktop-qa.outcome == 'success'
        env:
          CAIWU_DESKTOP_UPDATE_QA_FIXTURE: ${{ runner.temp }}/m21-update-qa
          CAIWU_DESKTOP_HANDOFF_EXECUTABLE: ${{ runner.temp }}/m21-update-installed/caiwu-desktop/caiwu-desktop.exe
          CAIWU_DESKTOP_HANDOFF_LOG: ${{ runner.temp }}/m21-update-handoff-events.log
          CAIWU_DESKTOP_OLD_INSTALLER: ${{ github.workspace }}/app/apps/desktop/release-old/caiwu-desktop-0.0.9-x64-setup.exe
        run: |
          pnpm exec playwright test --config apps/desktop/qa/handoff.playwright.config.ts 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m21-update-handoff.log"
          exit $LASTEXITCODE
      - name: 保存安装包和更新校验清单
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: caiwu-desktop-windows-nsis
          path: |
            app/apps/desktop/release/*-setup.exe
            app/apps/desktop/release/*-update.json
          if-no-files-found: error
          retention-days: 3
      - name: 保存去敏步骤状态
        if: always()
        run: |
          @(
            'install=${{ steps.install.outcome }}',
            'shutdown-node=${{ steps.shutdown-node.outcome }}',
            'build=${{ steps.build.outcome }}',
            'native=${{ steps.native.outcome }}',
            'nsis=${{ steps.package.outcome }}',
            'windows-installed-qa=${{ steps.desktop-qa.outcome }}',
            'update-shell-handoff=${{ steps.update-handoff.outcome }}'
          ) | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/m21-steps.log"
      - name: 保存必要构建日志（不包含账套、配置或截图）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caiwu-desktop-build-logs
          path: |
            ${{ runner.temp }}/m21-steps.log
            ${{ runner.temp }}/m21-shutdown-node.log
            ${{ runner.temp }}/m21-package-old.log
            ${{ runner.temp }}/m21-package.log
            ${{ runner.temp }}/m21-desktop-qa.log
            ${{ runner.temp }}/m21-update-handoff.log
            ${{ runner.temp }}/m21-update-handoff-events.log
            ${{ runner.temp }}/m21-qa/config/logs/desktop.log*
            ${{ runner.temp }}/m21-update-qa/config/logs/desktop.log*
          if-no-files-found: ignore
          retention-days: 3

  checks:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: pwsh
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 仅影响本 job 的 Git 检出；保留仓库 LF，避免 Windows autocrlf 使全仓格式检查误报。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: 安装冻结依赖和浏览器
        id: install
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install chromium
      - name: 全仓检查
        id: check
        # 保留失败，独立构建/安装回归继续收集结果；末尾显式使 job 失败，不能掩盖 check。
        continue-on-error: true
        run: |
          $env:CI = '' # 仓库 Playwright 配置在 CI 默认重试一次，本任务要求零 retry。
          pnpm check
      - name: 保存去敏检查步骤状态
        if: always()
        run: |
          @(
            'install=${{ steps.install.outcome }}',
            'check=${{ steps.check.outcome }}'
          ) | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/m21-check-steps.log"
      - name: 保存私有检查状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caiwu-desktop-check-status
          path: ${{ runner.temp }}/m21-check-steps.log
          if-no-files-found: ignore
          retention-days: 3
      - name: 保留全仓检查的失败结论
        if: always() && steps.check.outcome == 'failure'
        run: |
          Write-Error 'pnpm check 失败；即使已生成安装包，本 workflow 仍为失败，不重试失败检查。请查看原始检查错误。'
          exit 1
