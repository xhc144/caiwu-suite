name: Installed Desktop financial business QA
on:
  push:
    branches: [codex/installed-financial-qa]
    paths:
      - 'tests/InstalledFinancialQA/**'
      - '.github/workflows/windows-installed-financial-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installed-financial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-financial:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.402
      - name: Build independent controller and preserve delivery hold
        shell: pwsh
        run: |
          if (-not (Test-Path docs/acceptance/DELIVERY_PAUSED.md)) { throw 'Production delivery must remain held.' }
          dotnet build tests/InstalledFinancialQA -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'External financial controller build failed.' }
      - name: Prepare existing pinned installer tool
        shell: pwsh
        run: |
          python packaging-next/bootstrap-nsis.py --destination .tools/nsis
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NSIS preparation failed.' }
      - name: Build one source-bound INTERNAL-UNVALIDATED synthetic candidate
        shell: pwsh
        timeout-minutes: 8
        run: |
          ./packaging-next/Build-InternalQa.ps1 -OutputDirectory artifacts/internal-qa/0.1.0.1 -ExpectedCommit '${{ github.sha }}' -Version 0.1.0.1 -MakeNsis .tools/nsis/nsis-3.13/makensis.exe -ControllerExecutable tests/InstalledFinancialQA/bin/Release/net10.0-windows/Caiwu.InstalledFinancialQA.exe
      - name: Actual installed normal App financial persistence and all-codec recovery
        shell: pwsh
        timeout-minutes: 9
        run: |
          ./tests/InstalledFinancialQA/run.ps1 -Installer '${{ github.workspace }}/artifacts/internal-qa/0.1.0.1/INTERNAL-UNVALIDATED-caiwu-0.1.0.1-win-x64-setup.exe' -OutputDirectory '${{ runner.temp }}/installed-financial-${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Confirm exact unchanged source and hold
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path docs/acceptance/DELIVERY_PAUSED.md)) { throw 'Production hold removed.' }
          if (@(git status --porcelain --untracked-files=normal).Count -ne 0) { git status --short; throw 'Source changed during execution.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-financial-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/installed-financial-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.json
            ${{ runner.temp }}/installed-financial-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.png
            ${{ runner.temp }}/installed-financial-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.log
            artifacts/internal-qa/0.1.0.1/INTERNAL-UNVALIDATED.json
            artifacts/internal-qa/0.1.0.1/preparation.json
          if-no-files-found: warn
