name: Probe PDF tools on official runner (2026-10-27)

on:
  push:
    branches:
      - maintenance/verify-voucher-fixtures-20261027
    paths:
      - .github/workflows/verify-voucher-fixtures-20261027.yml

permissions:
  contents: read

concurrency:
  group: probe-pdf-tools-20261027-fc98
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'xhc144/caiwu-suite' && github.ref == 'refs/heads/maintenance/verify-voucher-fixtures-20261027' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fc98ed3d2a68e299e27e4fb888e57da97faa66fb
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Confirm exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "fc98ed3d2a68e299e27e4fb888e57da97faa66fb"
      - name: Probe both PDF commands without installing anything
        shell: bash
        run: |
          set +e
          command -v pdfinfo
          pdfinfo_status=$?
          command -v pdftotext
          pdftotext_status=$?
          printf 'pdfinfo_exit=%s\npdftotext_exit=%s\n' "$pdfinfo_status" "$pdftotext_status"
          test "$pdfinfo_status" -eq 0 && test "$pdftotext_status" -eq 0
