name: Diagnose first voucher filter race (2026-10-27)

on:
  push:
    branches:
      - maintenance/verify-voucher-fixtures-20261027
    paths:
      - .github/workflows/verify-voucher-fixtures-20261027.yml

permissions:
  contents: read

concurrency:
  group: diagnose-voucher-filter-20261027-f429618
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'xhc144/caiwu-suite' && github.ref == 'refs/heads/maintenance/verify-voucher-fixtures-20261027' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f42961887ffdb46846880836e86c80ff1474925a
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Confirm exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "f42961887ffdb46846880836e86c80ff1474925a"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: pnpm build:web
      - name: Capture first amount-filter race without retries
        run: pnpm exec playwright test modules/voucher-book/e2e/filters.spec.ts -g '元金额' --retries=0 --repeat-each=15 --max-failures=1
      - name: Upload failed UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voucher-filter-first-race-${{ github.run_id }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
