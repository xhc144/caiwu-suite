name: INTERNAL-UNVALIDATED Windows installation QA
on:
  push:
    branches: [codex/release-candidate]
    paths:
      - '.github/workflows/windows-internal-qa.yml'
      - 'packaging-next/Build-InternalQa.ps1'
      - 'packaging-next/Test-WindowsDelivery.ps1'
      - 'packaging-next/src/**'
      - 'src/Caiwu.Desktop/**'
      - 'tests/Caiwu.Delivery.Tests/InstalledDesktop/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caiwu-internal-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.402
      - name: Build independent external normal-login controller
        shell: pwsh
        run: |
          if (-not (Test-Path docs/acceptance/DELIVERY_PAUSED.md)) { throw 'Internal QA must preserve the delivery hold.' }
          dotnet build tests/Caiwu.Delivery.Tests/InstalledDesktop -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Independent controller build failed.' }
          ./tests/Caiwu.Delivery.Tests/Test-WindowsHarness.ps1
      - name: Prepare hash-pinned official NSIS tool
        shell: pwsh
        run: |
          python packaging-next/bootstrap-nsis.py --destination .tools/nsis
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NSIS bootstrap failed.' }
      - name: Build two explicitly unvalidated internal candidates from this exact clean SHA
        shell: pwsh
        timeout-minutes: 10
        run: |
          $controller = 'tests/Caiwu.Delivery.Tests/InstalledDesktop/bin/Release/net10.0-windows/Caiwu.Delivery.InstalledDesktop.exe'
          foreach ($version in @('0.1.0.1', '0.1.0.2')) {
            ./packaging-next/Build-InternalQa.ps1 -OutputDirectory "artifacts/internal-qa/$version" -ExpectedCommit '${{ github.sha }}' -Version $version -MakeNsis .tools/nsis/nsis-3.13/makensis.exe -ControllerExecutable $controller
          }
      - name: Run actual NSIS install normal App flows busy upgrade idle protected upgrade and retention uninstall
        shell: pwsh
        timeout-minutes: 9
        run: |
          ./packaging-next/Test-WindowsDelivery.ps1 -Installer "${{ github.workspace }}/artifacts/internal-qa/0.1.0.1/INTERNAL-UNVALIDATED-caiwu-0.1.0.1-win-x64-setup.exe" -UpgradeInstaller "${{ github.workspace }}/artifacts/internal-qa/0.1.0.2/INTERNAL-UNVALIDATED-caiwu-0.1.0.2-win-x64-setup.exe" -OutputDirectory "${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}" -ControllerExecutable tests/Caiwu.Delivery.Tests/InstalledDesktop/bin/Release/net10.0-windows/Caiwu.Delivery.InstalledDesktop.exe -RequireManagedDesktop
      - name: Confirm internal scope and unchanged source
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path docs/acceptance/DELIVERY_PAUSED.md)) { throw 'Internal QA removed the production hold.' }
          if (@(git status --porcelain --untracked-files=normal).Count -ne 0) { git status --short; throw 'Source identity changed during internal QA.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: INTERNAL-UNVALIDATED-installation-evidence-${{ github.sha }}
          path: |
            artifacts/internal-qa/*/INTERNAL-UNVALIDATED*.exe
            artifacts/internal-qa/*/INTERNAL-UNVALIDATED.json
            artifacts/internal-qa/*/preparation.json
            artifacts/internal-qa/*/payload/payload-manifest.json
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/windows-acceptance.json
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/installed-runtime/*.json
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/installed-runtime/*.png
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/installed-runtime/*.log
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/upgraded-runtime/*.json
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/upgraded-runtime/*.png
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/upgraded-runtime/*.log
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/migration-runtime/*.json
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/migration-runtime/*.png
            ${{ runner.temp }}/caiwu-internal-qa-${{ github.run_id }}-${{ github.run_attempt }}/migration-runtime/*.log
          if-no-files-found: warn
