# Root-approved private validation workflow. No user distribution or Release permission.
name: Private approved-source production candidate validation
on:
  push:
    branches: [codex/final-private-packaging]
    paths: ['.github/workflows/windows-private-delivery.yml']
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full immutable source SHA explicitly approved by the delivery owner
        type: string
        required: true
      initial_version:
        description: Explicit four-part initial installation test version
        type: string
        required: true
      upgrade_version:
        description: Explicit four-part final candidate version greater than the initial version
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: caiwu-private-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.event.repository.private == true
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CAIWU_APPROVED_SHA: ${{ inputs.expected_commit || github.sha }}
      CAIWU_WORKFLOW_SHA: ${{ github.sha }}
      CAIWU_INITIAL_VERSION: ${{ inputs.initial_version || '0.1.0.3' }}
      CAIWU_UPGRADE_VERSION: ${{ inputs.upgrade_version || '0.1.0.4' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.expected_commit || github.sha }}
          fetch-depth: 0
      - name: Enforce owning-review hold and exact immutable composition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CAIWU_APPROVED_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:CAIWU_APPROVED_SHA -cne $env:CAIWU_WORKFLOW_SHA -or (git rev-parse HEAD).Trim() -cne $env:CAIWU_APPROVED_SHA) { throw 'Dispatch must target exactly the full reviewed workflow/source SHA.' }
          if (Test-Path docs/acceptance/DELIVERY_PAUSED.md) { throw 'Independent review still pauses production packaging.' }
          if (-not (Test-Path docs/acceptance/PRIVATE_VALIDATION_ONLY.md)) { throw 'Private validation scope record is required.' }
          if (@(git status --porcelain --untracked-files=normal).Count -ne 0) { throw 'Source is not clean.' }
          git diff --exit-code 4689e29d654ddf15446b121d5281255b8af4b8f5 HEAD -- src packaging-next/src packaging-next/locks packaging-next/build.py tests/Caiwu.Delivery.Tests/InstalledDesktop
          if ($LASTEXITCODE -ne 0) { throw 'Production or existing lifecycle controller differs from the explicit reviewed integration baseline.' }
          foreach ($version in @($env:CAIWU_INITIAL_VERSION, $env:CAIWU_UPGRADE_VERSION)) {
            if ($version -cnotmatch '^\d+\.\d+\.\d+\.\d+$' -or @($version.Split('.') | Where-Object { [int64]$_ -gt 65535 }).Count -gt 0) { throw 'Explicit four-part Windows versions in 0..65535 are required.' }
          }
          if ([version]$env:CAIWU_UPGRADE_VERSION -le [version]$env:CAIWU_INITIAL_VERSION) { throw 'Upgrade version must be greater.' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.402
      - name: Check gate regressions and parse runtime assertions
        shell: pwsh
        run: |
          ./tests/Caiwu.Delivery.Tests/Test-WindowsHarness.ps1
          python tests/Caiwu.Delivery.Tests/test_build_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Production build gate regression failed.' }
      - name: Freeze reviewed Git objects and build independent controller
        shell: pwsh
        run: |
          python packaging-next/freeze-source.py --commit $env:CAIWU_APPROVED_SHA --out artifacts/source-freeze.json
          if ($LASTEXITCODE -ne 0) { throw 'Source inventory failed.' }
          dotnet build tests/Caiwu.Delivery.Tests/InstalledDesktop -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Independent controller build failed.' }
          dotnet build tests/InstalledFinancialQA -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Installed financial controller build failed.' }
          dotnet build tests/InstalledBookFlowsQA -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Installed book-flow controller build failed.' }
      - name: Prepare hash-pinned official NSIS
        shell: pwsh
        run: |
          python packaging-next/bootstrap-nsis.py --destination .tools/nsis
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NSIS preparation failed.' }
      - name: Rebuild initial and upgrade candidates from ordinary production builder
        shell: pwsh
        run: |
          python packaging-next/build.py --version $env:CAIWU_INITIAL_VERSION --managed-data-contract --expected-commit $env:CAIWU_APPROVED_SHA --makensis .tools/nsis/nsis-3.13/makensis.exe --out artifacts/delivery/first
          if ($LASTEXITCODE -ne 0) { throw 'Initial production-path build failed.' }
          python packaging-next/build.py --version $env:CAIWU_UPGRADE_VERSION --managed-data-contract --expected-commit $env:CAIWU_APPROVED_SHA --makensis .tools/nsis/nsis-3.13/makensis.exe --out artifacts/delivery/next
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade production-path build failed.' }
          foreach ($directory in @('artifacts/delivery/first', 'artifacts/delivery/next')) {
            $release = Get-Content "$directory/release-manifest.json" -Raw | ConvertFrom-Json
            $payload = Get-Content "$directory/payload/payload-manifest.json" -Raw | ConvertFrom-Json
            if ($release.commit -cne $env:CAIWU_APPROVED_SHA -or $payload.commit -cne $env:CAIWU_APPROVED_SHA -or -not $release.managedDataIntegration -or -not $payload.managedDataContract) { throw 'Source/capability mismatch.' }
            if (Test-Path "$directory/payload/INTERNAL-UNVALIDATED.txt") { throw 'An internal artifact was substituted.' }
            foreach ($file in $release.files) {
              $actual = Get-Item (Join-Path $directory $file.path)
              if ($actual.Length -ne $file.bytes -or (Get-FileHash $actual.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $file.sha256) { throw 'Built artifact hash/length mismatch.' }
            }
          }
      - name: Exercise actual native install upgrade restore and retention lifecycle
        shell: pwsh
        run: |
          ./packaging-next/Test-WindowsDelivery.ps1 -ProductionCandidate -ExpectedCommit $env:CAIWU_APPROVED_SHA -InitialVersion $env:CAIWU_INITIAL_VERSION -UpgradeVersion $env:CAIWU_UPGRADE_VERSION -RequireManagedDesktop -Installer "${{ github.workspace }}/artifacts/delivery/first/caiwu-$($env:CAIWU_INITIAL_VERSION)-win-x64-setup.exe" -UpgradeInstaller "${{ github.workspace }}/artifacts/delivery/next/caiwu-$($env:CAIWU_UPGRADE_VERSION)-win-x64-setup.exe" -ControllerExecutable tests/Caiwu.Delivery.Tests/InstalledDesktop/bin/Release/net10.0-windows/Caiwu.Delivery.InstalledDesktop.exe -OutputDirectory "${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Actual installed financial business and four-codec recovery on newly built production candidate
        shell: pwsh
        timeout-minutes: 9
        run: |
          ./tests/InstalledFinancialQA/run.ps1 -Installer "${{ github.workspace }}/artifacts/delivery/next/caiwu-$($env:CAIWU_UPGRADE_VERSION)-win-x64-setup.exe" -Version $env:CAIWU_UPGRADE_VERSION -OutputDirectory "${{ runner.temp }}/caiwu-private-financial-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Complete installed book voucher summary and expired-session acceptance on production candidate
        shell: pwsh
        timeout-minutes: 13
        run: |
          ./tests/InstalledBookFlowsQA/Run-InstalledBookFlows.ps1 -Installer "${{ github.workspace }}/artifacts/delivery/next/caiwu-$($env:CAIWU_UPGRADE_VERSION)-win-x64-setup.exe" -Version $env:CAIWU_UPGRADE_VERSION -ControllerExecutable tests/InstalledBookFlowsQA/bin/Release/net10.0-windows/Caiwu.InstalledBookFlowsQA.exe -OutputDirectory "${{ runner.temp }}/caiwu-private-bookflows-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Require unchanged clean source and preserve Chinese guide
        if: always()
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:CAIWU_APPROVED_SHA -or @(git status --porcelain --untracked-files=normal).Count -ne 0) { throw 'Source changed during validation.' }
          New-Item -ItemType Directory -Force artifacts/delivery-docs | Out-Null
          Copy-Item docs/user-guide/INSTALL_AND_USE.zh-CN.md artifacts/delivery-docs/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PRIVATE-DELIVERY-CANDIDATE-${{ github.sha }}
          path: |
            artifacts/source-freeze.json
            artifacts/delivery/*/*setup.exe
            artifacts/delivery/*/*payload.zip
            artifacts/delivery/*/release-manifest.json
            artifacts/delivery/*/delivery-tests.json
            artifacts/delivery/*/SHA256SUMS
            artifacts/delivery/*/payload/payload-manifest.json
            artifacts/delivery-docs/INSTALL_AND_USE.zh-CN.md
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/windows-acceptance.json
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/restored-readback.json
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/installed-runtime/*.json
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/installed-runtime/*.png
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/installed-runtime/*.log
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/upgraded-runtime/*.json
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/upgraded-runtime/*.png
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/migration-runtime/*.json
            ${{ runner.temp }}/caiwu-private-delivery-${{ github.run_id }}-${{ github.run_attempt }}/migration-runtime/*.png
            ${{ runner.temp }}/caiwu-private-financial-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.json
            ${{ runner.temp }}/caiwu-private-financial-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.png
            ${{ runner.temp }}/caiwu-private-financial-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.log
            ${{ runner.temp }}/caiwu-private-bookflows-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/caiwu-private-bookflows-${{ github.run_id }}-${{ github.run_attempt }}/runtime/*.json
            ${{ runner.temp }}/caiwu-private-bookflows-${{ github.run_id }}-${{ github.run_attempt }}/runtime/*.png
            ${{ runner.temp }}/caiwu-private-bookflows-${{ github.run_id }}-${{ github.run_attempt }}/runtime/*.log
          if-no-files-found: warn
