name: Windows desktop verification
on:
  push:
    branches: [codex/windows-mvp]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caiwu-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402
      - name: Build, test and package self-authored software
        shell: pwsh
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: caiwu-windows-preview-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/*.json
            artifacts/test-results/
            artifacts/verification/
            artifacts/independent-acceptance/
          if-no-files-found: warn
