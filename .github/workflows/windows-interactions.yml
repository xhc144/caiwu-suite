name: Focused native Windows interactions
on:
  push:
    branches: [codex/sprint-integration-2]
    paths:
      - '.github/workflows/windows-interactions.yml'
      - 'tests/Caiwu.Acceptance/MutationWindows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caiwu-native-interactions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  interactions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.402
      - name: Preserve distribution hold
        shell: pwsh
        run: |
          if (-not (Test-Path docs/acceptance/DELIVERY_PAUSED.md)) { throw 'Native interaction review requires delivery hold.' }
      - name: Exercise each original-context mutation in its own bounded process
        shell: pwsh
        run: ./tests/Caiwu.Acceptance/MutationWindows/run.ps1 -OutputDirectory artifacts/mutation-windows
      - name: Exercise actual native picker focus and keyboard input
        if: always()
        shell: pwsh
        run: ./tests/Caiwu.Acceptance/NativeFocus/run.ps1 -OutputDirectory artifacts/native-focus
      - name: Inspect delivered visual resources on the same production tree
        if: always()
        shell: pwsh
        run: ./tests/Caiwu.VisualReview/run.ps1 -OutputDirectory artifacts/visual-checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: caiwu-native-interactions-${{ github.sha }}
          path: |
            artifacts/mutation-windows/**/*.json
            artifacts/mutation-windows/**/*.jsonl
            artifacts/mutation-windows/**/*.png
            artifacts/mutation-windows/**/*.log
            artifacts/native-focus/*.json
            artifacts/native-focus/*.log
            artifacts/visual-checks/*.json
            artifacts/visual-checks/*.png
            artifacts/visual-checks/*.log
          if-no-files-found: warn
