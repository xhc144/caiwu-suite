# 私有 NSIS 构建；签名与受信任更新分发渠道尚待接入。
appId: com.caiwu.desktop
productName: 财务软件
executableName: caiwu-desktop
artifactName: caiwu-desktop-${version}-${arch}-setup.${ext}
directories:
  output: release
files:
  - dist/*.cjs
  - dist/icon.ico
  - package.json
extraResources:
  - from: ../web/dist
    to: web
asarUnpack:
  - '**/node_modules/better-sqlite3/**/*'
npmRebuild: true
nativeRebuilder: sequential
afterPack: build/after-pack.cjs
publish: null
win:
  icon: dist/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  installerLanguages: [zh_CN]
  language: '2052'
  include: build/installer.nsh
  runAfterFinish: false
  shortcutName: 财务软件
  uninstallDisplayName: 财务软件
